name: 문제 신고
description: 동작 오류나 화면 문제를 알려 주세요.
title: 'fix: '
body:
  - type: markdown
    attributes:
      value: '계정 정보·인증 정보·작품 원문은 올리지 마세요. 화면을 첨부할 때는 필요한 부분만 남겨 주세요. 보안 문제는 SECURITY.md의 비공개 신고를 이용해 주세요.'
  - type: input
    id: version
    attributes:
      label: 확장 버전과 브라우저 버전
      placeholder: '확장 0.1.0 / Chrome 버전 / Windows 또는 다른 운영체제'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 읽기 방식과 관련 설정, 수행한 순서를 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 기대한 결과와 실제 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 추가 정보
      description: 개인정보와 작품 원문을 제외한 오류 메시지·화면을 첨부할 수 있습니다.
