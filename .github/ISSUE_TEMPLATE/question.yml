name: 사용 방법 문의
description: 설정 방법이나 기능에 관해 궁금한 점을 질문하세요.
title: '[질문] '
labels: [question, 'status: triage']
body:
  - type: markdown
    attributes:
      value: |
        [사용 안내](https://github.com/jukrap/unofficial-novelpia-patch/blob/main/docs/USAGE.md)를 먼저 확인해 보세요.
        동작 오류는 문제 신고로, 기능 추가는 기능·개선 제안으로 접수할 수 있습니다. 계정 정보나 작품 원문은 올리지 마세요.
  - type: textarea
    id: question
    attributes:
      label: 무엇을 하고 싶으신가요?
      description: 하려는 일과 궁금한 점을 함께 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: 확인한 안내나 시도한 방법
      description: 찾아본 설명이나 변경해 본 설정이 있으면 알려 주세요.
  - type: input
    id: environment
    attributes:
      label: 사용 환경
      description: 환경과 관련된 질문일 때만 적어 주세요.
      placeholder: '확장 버전 / 브라우저·운영체제 / 스크롤 또는 페이지 읽기'
