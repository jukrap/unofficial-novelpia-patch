name: 기능·개선 제안
description: 불편한 상황과 원하는 결과를 알려 주세요.
title: '[제안] '
labels: [enhancement, 'status: triage']
body:
  - type: markdown
    attributes:
      value: |
        사용 방법이 궁금하다면 [사용 질문](https://github.com/jukrap/unofficial-novelpia-patch/issues/new?template=question.yml)을 이용해 주세요.
        비슷한 제안이 있는지 확인하고, 화면 자료에는 작품 원문·계정 정보를 넣지 말아 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 불편한가요?
      description: 사용 중 하려던 일과 막힌 부분을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 어떻게 달라지면 좋을까요?
      description: 구현 방법을 몰라도 괜찮습니다. 원하는 결과나 짧은 예시를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 사용하는 방법이나 다른 아이디어
      description: 대체 방법이나 참고 자료가 있을 때만 적어 주세요.
