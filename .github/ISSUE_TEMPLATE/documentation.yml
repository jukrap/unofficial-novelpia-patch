name: 문서 오류·개선
description: 빠진 설명, 잘못된 안내나 따라 하기 어려운 부분을 알려 주세요.
title: '[문서] '
labels: [documentation, 'status: triage']
body:
  - type: input
    id: location
    attributes:
      label: 어느 문서인가요?
      placeholder: '문서 주소 또는 파일명과 제목'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 어떤 부분을 고치면 좋을까요?
      description: 틀린 내용이나 이해하기 어려운 부분을 알려 주세요. 새 설명이 필요한 경우도 적을 수 있습니다.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 제안하는 설명이나 참고 자료
      description: 수정 문장이나 근거가 있을 때만 적어 주세요. 개인 정보는 제외해 주세요.
