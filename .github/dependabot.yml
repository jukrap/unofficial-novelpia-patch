version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Seoul
    target-branch: develop
    labels: [dependencies, 'area: tooling']
    open-pull-requests-limit: 3
    ignore:
      # Node의 주요 버전은 실행 환경·CI·타입을 함께 확인한 뒤 올립니다.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ESLint 파서와 컴파일러 API 호환성을 함께 확인한 뒤 주요 버전을 올립니다.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      runtime-compatible:
        dependency-type: production
        update-types: [minor, patch]
      tooling-compatible:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Seoul
    target-branch: develop
    labels: [dependencies, 'area: tooling']
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        patterns: ['*']
        update-types: [minor, patch]
